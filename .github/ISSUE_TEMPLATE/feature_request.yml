name: Feature request
description: Propose an addition or change to tai-toolbox
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed, and what problem does it solve? Remember the plugin rule — tai-toolbox depends on tai-contract + tai-kit only, never imports the skeleton, and heavier dependencies stay behind extras.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tai-toolbox version
      description: The version you are using, if relevant.
      placeholder: "0.1.0"
    validations:
      required: false
